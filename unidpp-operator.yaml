api_version: unidpp.org/v1
deployment:
  name: unidpp-reference
  profile: reference
  base_url: https://registry.unidpp.org
branding:
  organization: UniDPP
  product_name: UniDPP Reference Deployment
services:
  registry:
    bind: 127.0.0.1:8390
    state_file: registry-journal.jsonl
    public_url: https://registry.unidpp.org
  trust:
    bind: 127.0.0.1:8391
    state_file: run/trust-journal.jsonl
  log:
    bind: 127.0.0.1:8392
    log_id: unidpp-pilot-log-1
    state_file: run/log-journal.jsonl
    external_tsa_url: http://timestamp.digicert.com
  issuer:
    bind: 127.0.0.1:8393
    pack_suites: [ecdsa-p256, sm2]
    registry_url: http://127.0.0.1:8390
  projector:
    bind: 127.0.0.1:8394
  gateway:
    bind: 127.0.0.1:8395
    issuer_url: http://127.0.0.1:8393
    # The consumer report channel (TODO.impl 224): journaled under
    # the pilot's run/ (append-only, replayed on restart) with a
    # per-identifier rate window. No scan_policy here on purpose:
    # absent = the gate is open — public resolution is the reference
    # deployment's doctrine; scan policy is what a deployment under
    # load opts into.
    feedback:
      journal: run/feedback-journal.jsonl
      rate_per_minute: 10
  archive:
    bind: 127.0.0.1:8396
  console:
    bind: 127.0.0.1:8389
    public_url: https://console.unidpp.org
  hub:
    bind: 127.0.0.1:8397
    hub_id: unidpp-hub-pilot
    seed: pilot-hub-relay-seed
sovereignty:
  external_calls: external
