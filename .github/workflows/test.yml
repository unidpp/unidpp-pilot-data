name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          set -eu
          for f in stack.sh seed-pilot.sh seed-jp.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
