name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          set -eu
          for f in stack.sh seed-pilot.sh seed-jp.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

  # The durability contract, exercised end to end: the stack slice a
  # backup captures, restored and drilled on a clean runner.
  ops-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-pilot-data
    steps:
      - uses: actions/checkout@v4
        with:
          path: unidpp-pilot-data
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-cli
          path: unidpp-cli
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-config
          path: unidpp-config
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-registry
          path: unidpp-registry
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-issuer
          path: unidpp-issuer
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-trust
          path: unidpp-trust
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-log
          path: unidpp-log
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-projector
          path: unidpp-projector
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-gateway
          path: unidpp-gateway
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-archive
          path: unidpp-archive
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-console
          path: unidpp-console
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the stack
        run: |
          set -eu
          for repo in unidpp-cli unidpp-config unidpp-registry unidpp-trust \
                      unidpp-log unidpp-issuer unidpp-projector unidpp-gateway \
                      unidpp-archive unidpp-console; do
            cargo build --release --manifest-path "../$repo/Cargo.toml"
          done
      - name: Start the stack
        run: |
          set -eu
          ./stack.sh start
          ./stack.sh status
      - name: Seed
        run: ./seed-pilot.sh
      - name: 'The contract: backup, verify, restore parity'
        run: |
          set -eu
          ./unidpp-ops backup
          archive="$(printf '%s\n' backups/*.tar.gz | sort -r | head -1)"
          ./unidpp-ops verify "$archive"
          ./unidpp-ops restore "$archive" ci-restored
      - name: The drill
        run: ./unidpp-ops drill
      - name: 'The recover drill (original shape)'
        run: ./unidpp-ops drill --recover
      - name: 'The tenant runner: whitelabel up, healthy, down'
        run: |
          set -eu
          cp="$(printf '%s\n' tenants/acme-cn/*-journal.jsonl | sort | head -1)"
          before="$(sha256sum "$cp" | cut -d' ' -f1)"
          ./tenants/up.sh acme-cn start
          ./tenants/up.sh acme-cn status | grep -c running
          curl -sf -m 5 http://127.0.0.1:9590/healthz
          curl -sf -m 5 http://127.0.0.1:9593/healthz
          ./tenants/up.sh acme-cn stop
          after="$(sha256sum "$cp" | cut -d' ' -f1)"
          [ "$before" = "$after" ] && echo "tenant journals append-only across the cycle"
      - name: 'The data-only bundle restores as a tenant'
        run: |
          set -eu
          ./unidpp-ops bundle acme-cn --data-only
          data="$(printf '%s\n' backups/acme-cn-data-*.tar.gz | sort -r | head -1)"
          ./unidpp-ops verify "$data"
          ./unidpp-ops restore "$data" acme-cn-moved
          ../unidpp-config/target/release/unidpp-config validate tenants/acme-cn-moved/unidpp-operator.yaml
      - name: The bundle
        run: |
          set -eu
          ./seed-jp.sh >/dev/null 2>&1 || true
          # acme-cn is the sovereign tenant; create it if the runner's
          # seed did not (it is committed, so it exists).
          ./unidpp-ops bundle acme-cn
          bundle="$(printf '%s\n' backups/acme-cn-bundle-*.tar.gz | sort -r | head -1)"
          ./unidpp-ops verify "$bundle"
          tmp="$(mktemp -d)"
          tar -xzf "$bundle" -C "$tmp"
          "$tmp/acme-cn/bin/unidpp-config" validate "$tmp/acme-cn/unidpp-operator.yaml"
      - name: Teardown
        if: always()
        run: ./stack.sh stop
